<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Uma experiência interativa para refletir sobre o futuro da inteligência artificial."
    >

    <link rel="stylesheet" href="style.css">

    <title>Você decide o futuro da IA</title>
</head>

<body>
    <main class="caixa-principal">
        <header class="cabecalho">
            <span class="tag">INTELIGÊNCIA ARTIFICIAL</span>

            <h1>Você decide o futuro da IA</h1>

            <p>
                Suas escolhas podem mudar o rumo da inteligência artificial.
                Faça suas escolhas e descubra o resultado.
            </p>
        </header>

        <section class="caixa-jogo" aria-label="Jogo interativo">
            <div class="caixa-perguntas">
                <!-- As perguntas serão inseridas pelo JavaScript -->
            </div>

            <div class="caixa-alternativas">
                <!-- As alternativas serão inseridas pelo JavaScript -->
            </div>

            <div class="caixa-resultado" aria-live="polite">
                <h2>Seu resultado</h2>
                <p class="texto-resultado"></p>
            </div>
        </section>

        <footer class="rodape">
            <p>O futuro da IA também depende das nossas escolhas.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
