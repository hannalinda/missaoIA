<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Quiz interativo sobre saúde mental, autocuidado e bem-estar emocional."
    >

    <link rel="stylesheet" href="style.css">

    <title>Você cuida da sua saúde mental?</title>
</head>

<body>

    <main class="caixa-principal">

        <header class="cabecalho">
            <span class="tag">🧠 SAÚDE MENTAL</span>

            <h1>Você cuida da sua saúde mental?</h1>

            <p>
                Responda às perguntas e reflita sobre seus hábitos,
                emoções e formas de cuidar do seu bem-estar.
            </p>
        </header>

        <section class="caixa-jogo" aria-label="Quiz de saúde mental">

            <div class="caixa-perguntas"></div>

            <div class="caixa-alternativas"></div>

            <div class="caixa-resultado" aria-live="polite">
                <h2>🌱 Seu resultado</h2>

                <p class="texto-resultado"></p>
            </div>

        </section>

        <footer class="rodape">
            <p>
                Cuidar da mente também é cuidar de si. 💙
            </p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
